<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Tiger Soft Manual</title>
  <style>
    :root{
      --bg: #f6f7f8;
      --surface: #ffffff;
      --text: #202124;
      --muted: #6f7379;
      --border: #e5e7eb;
      --accent: #d71920;
      --accent-dark: #b11218;
      --accent-soft: #fff0f1;
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body{
      margin:0;
      font-family: "Noto Sans Thai", "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #fff8f8 0, var(--bg) 360px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container{
      flex: 1;
      max-width: 1160px;
      margin: 0 auto;
      padding: calc(24px + env(safe-area-inset-top)) 20px 36px;
      width: 100%;
    }

    .site-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 30px;
    }

    .brand{
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:var(--text);
      font-size:20px;
      font-weight:800;
      letter-spacing:-.7px;
      text-decoration:none;
    }

    .brand-mark{
      display:grid;
      width:30px;
      height:30px;
      place-items:center;
      border-radius:9px;
      background:var(--accent);
      color:#fff;
      font-family:Georgia, serif;
      font-size:22px;
      font-style:italic;
      line-height:1;
    }

    .header-label{
      color:var(--muted);
      font-size:13px;
      font-weight:600;
    }

    .hero{
      position:relative;
      overflow:hidden;
      padding:clamp(28px, 5vw, 52px);
      border:1px solid #f2e1e2;
      border-radius:var(--radius);
      background:var(--surface);
      box-shadow:0 18px 45px rgba(40, 29, 18, .06);
    }

    .hero::after{
      position:absolute;
      top:-80px;
      right:-58px;
      width:230px;
      height:230px;
      border:36px solid var(--accent-soft);
      border-radius:50%;
      content:"";
      pointer-events:none;
    }

    .eyebrow{
      position:relative;
      z-index:1;
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin:0 0 12px;
      color:var(--accent-dark);
      font-size:13px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .eyebrow::before{
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--accent);
      content:"";
    }

    h1{
      position:relative;
      z-index:1;
      max-width:680px;
      margin:0;
      font-size:clamp(28px, 4vw, 44px);
      font-weight:800;
      letter-spacing:-1.3px;
      line-height:1.18;
    }

    .subtitle{
      position:relative;
      z-index:1;
      max-width:520px;
      margin:14px 0 0;
      color:var(--muted);
      font-size:16px;
      line-height:1.6;
    }

    .manual-count{
      position:relative;
      z-index:1;
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-top:26px;
      padding:8px 12px;
      border:1px solid #f3d5d6;
      border-radius:999px;
      background:#fff8f8;
      color:#7e3336;
      font-size:13px;
      font-weight:600;
    }

    .manual-count strong{ color:var(--accent-dark); font-size:15px; }

    .manuals-section{ margin-top:38px; }
    .section-heading{ margin-bottom:16px; }
    .section-heading h2{ margin:0; font-size:20px; letter-spacing:-.4px; }
    .section-heading p{ margin:5px 0 0; color:var(--muted); font-size:14px; }

    .grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:14px;
    }

    @media (max-width: 850px){ .grid{ grid-template-columns:repeat(2, minmax(0, 1fr)); } }

    .card{
      display:flex;
      align-items:flex-start;
      gap:15px;
      min-height:178px;
      cursor:pointer;
      border:1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      padding:20px;
      transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      user-select:none;
      text-align:left;
      color: var(--text);
    }

    .card:hover{
      transform:translateY(-3px);
      border-color:#efb6b8;
      box-shadow:0 12px 28px rgba(61, 40, 20, .08);
    }

    .card:focus-visible{
      border-color: var(--accent);
      outline:3px solid rgba(215, 25, 32, .22);
      outline-offset:2px;
    }

    .card.active{ border-color:var(--accent); background:#fff8f8; }

    .card-number{
      display:grid;
      flex:0 0 auto;
      width:38px;
      height:38px;
      place-items:center;
      border-radius:12px;
      background:var(--accent-soft);
      color:var(--accent-dark);
      font-size:13px;
      font-weight:800;
    }

    .card-content{ display:flex; flex:1; min-width:0; flex-direction:column; align-items:flex-start; }
    .file-type{
      color:var(--accent-dark);
      font-size:11px;
      font-weight:800;
      letter-spacing:.08em;
    }

    .card h3{
      margin:9px 0 0;
      font-size:16px;
      font-weight:700;
      letter-spacing:-.25px;
      line-height:1.48;
      color: var(--text);
    }

    .card-action{
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-top:auto;
      padding-top:18px;
      color:var(--accent-dark);
      font-size:13px;
      font-weight:700;
    }
    .arrow{ font-size:18px; line-height:.8; transition:transform .18s ease; }
    .card:hover .arrow{ transform:translateX(3px); }

    footer.footer{
      margin-top: auto;
      width: 100%;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background:rgba(255,255,255,.72);
    }

    @media (max-width: 600px){
      .container{ padding:calc(16px + env(safe-area-inset-top)) 16px 28px; }
      .site-header{ margin-bottom:20px; }
      .brand{ font-size:18px; }
      .brand-mark{ width:28px; height:28px; font-size:20px; }
      .header-label{ font-size:12px; }
      .hero{ padding:27px 22px; border-radius:16px; }
      .hero::after{ top:-92px; right:-100px; width:210px; height:210px; }
      h1{ font-size:30px; letter-spacing:-.9px; }
      .subtitle{ font-size:14px; }
      .manuals-section{ margin-top:28px; }
      .grid{ grid-template-columns:1fr; gap:11px; }
      .card{ min-height:0; padding:18px; }
      .card h3{ font-size:15px; }
      .card-action{ padding-top:14px; }
      footer.footer{ font-size:12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a class="brand" href="#" aria-label="TigerSoft">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span>TigerSoft</span>
      </a>
      <span class="header-label" id="manualCentre"></span>
    </header>

    <main>
      <section class="hero" aria-labelledby="pageTitle">
        <p class="eyebrow" id="heroEyebrow"></p>
        <h1 id="pageTitle"></h1>
        <p class="subtitle" id="pageSubtitle"></p>
        <div class="manual-count">
          <strong id="topicCount">0</strong>
          <span id="topicCountLabel"></span>
        </div>
      </section>

      <section class="manuals-section" aria-labelledby="sectionTitle">
        <div class="section-heading">
          <h2 id="sectionTitle"></h2>
          <p id="sectionSubtitle"></p>
        </div>
        <div class="grid" id="topicGrid" aria-label="Topics"></div>
      </section>
    </main>
  </div>

  <footer class="footer">
    &copy; 2026 Resonac Materials (Thailand) Co., Ltd. - TigerSoft Manual Developed by IT Department
  </footer>

  <script>
    const UI_TEXT = {
      pageTitle: "\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d\u0e01\u0e32\u0e23\u0e43\u0e0a\u0e49\u0e07\u0e32\u0e19\u0e23\u0e30\u0e1a\u0e1a Tiger Soft",
      subtitle: "\u0e04\u0e25\u0e34\u0e01\u0e2b\u0e31\u0e27\u0e02\u0e49\u0e2d\u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e40\u0e1b\u0e34\u0e14 PDF",
      topicsAria: "\u0e2b\u0e31\u0e27\u0e02\u0e49\u0e2d\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d",
      manualCentre: "\u0e28\u0e39\u0e19\u0e22\u0e4c\u0e23\u0e27\u0e21\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d",
      sectionSubtitle: "\u0e40\u0e25\u0e37\u0e2d\u0e01\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d\u0e17\u0e35\u0e48\u0e15\u0e49\u0e2d\u0e07\u0e01\u0e32\u0e23\u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e40\u0e1b\u0e34\u0e14\u0e40\u0e2d\u0e01\u0e2a\u0e32\u0e23 PDF",
      topicCountLabel: "\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14",
      openManual: "\u0e40\u0e1b\u0e34\u0e14\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d"
    };

    const TOPICS = [
      { id:"t1", no:"01", title:"\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d\u0e01\u0e32\u0e23\u0e40\u0e02\u0e49\u0e32\u0e43\u0e0a\u0e49\u0e07\u0e32\u0e19\u0e1c\u0e48\u0e32\u0e19\u0e21\u0e37\u0e2d\u0e16\u0e37\u0e2d\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a\u0e1e\u0e19\u0e31\u0e01\u0e07\u0e32\u0e19", file:"\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d\u0e01\u0e32\u0e23\u0e40\u0e02\u0e49\u0e32\u0e43\u0e02\u0e49\u0e1c\u0e48\u0e32\u0e19\u0e21\u0e37\u0e2d\u0e16\u0e37\u0e2d\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a\u0e1e\u0e19\u0e31\u0e01\u0e07\u0e32\u0e19.pdf" },
      { id:"t2", no:"02", title:"\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d\u0e01\u0e32\u0e23\u0e40\u0e02\u0e49\u0e32\u0e43\u0e0a\u0e49\u0e07\u0e32\u0e19\u0e1c\u0e48\u0e32\u0e19\u0e21\u0e37\u0e2d\u0e16\u0e37\u0e2d\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a\u0e2b\u0e31\u0e27\u0e2b\u0e19\u0e49\u0e32\u0e07\u0e32\u0e19", file:"\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d\u0e01\u0e32\u0e23\u0e40\u0e02\u0e49\u0e32\u0e43\u0e02\u0e49\u0e1c\u0e48\u0e32\u0e19\u0e21\u0e37\u0e2d\u0e16\u0e37\u0e2d\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a\u0e2b\u0e31\u0e27\u0e2b\u0e19\u0e49\u0e32.pdf" },
      { id:"t3", no:"03", title:"\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d\u0e01\u0e32\u0e23\u0e40\u0e02\u0e49\u0e32\u0e43\u0e0a\u0e49\u0e07\u0e32\u0e19\u0e1c\u0e48\u0e32\u0e19\u0e04\u0e2d\u0e21\u0e1e\u0e34\u0e27\u0e40\u0e15\u0e2d\u0e23\u0e4c\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a\u0e1e\u0e19\u0e31\u0e01\u0e07\u0e32\u0e19", file:"\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d\u0e01\u0e32\u0e23\u0e40\u0e02\u0e49\u0e32\u0e43\u0e02\u0e49\u0e1c\u0e48\u0e32\u0e19\u0e04\u0e2d\u0e21\u0e1e\u0e34\u0e27\u0e40\u0e15\u0e2d\u0e23\u0e4c\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a\u0e2b\u0e31\u0e27\u0e2b\u0e19\u0e49\u0e32\u0e07\u0e32\u0e19.pdf" },
      { id:"t4", no:"04", title:"\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d\u0e01\u0e32\u0e23\u0e40\u0e02\u0e49\u0e32\u0e43\u0e0a\u0e49\u0e07\u0e32\u0e19\u0e1c\u0e48\u0e32\u0e19\u0e04\u0e2d\u0e21\u0e1e\u0e34\u0e27\u0e40\u0e15\u0e2d\u0e23\u0e4c\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a\u0e2b\u0e31\u0e27\u0e2b\u0e19\u0e49\u0e32\u0e07\u0e32\u0e19", file:"\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d\u0e01\u0e32\u0e23\u0e40\u0e02\u0e49\u0e32\u0e43\u0e02\u0e49\u0e1c\u0e48\u0e32\u0e19\u0e04\u0e2d\u0e21\u0e1e\u0e34\u0e27\u0e40\u0e15\u0e2d\u0e23\u0e4c\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a\u0e1e\u0e19\u0e31\u0e01\u0e07\u0e32\u0e19.pdf" },
      { id:"t5", no:"05", title:"\u0e02\u0e31\u0e49\u0e19\u0e15\u0e2d\u0e19\u0e01\u0e32\u0e23\u0e15\u0e23\u0e27\u0e08\u0e2a\u0e2d\u0e1a\u0e04\u0e27\u0e32\u0e21\u0e16\u0e39\u0e01\u0e15\u0e49\u0e2d\u0e07\u0e01\u0e48\u0e2d\u0e19\u0e04\u0e33\u0e19\u0e27\u0e13\u0e40\u0e07\u0e34\u0e19\u0e40\u0e14\u0e37\u0e2d\u0e19", file:"\u0e02\u0e31\u0e49\u0e19\u0e15\u0e2d\u0e19\u0e01\u0e32\u0e23\u0e15\u0e23\u0e27\u0e08\u0e2a\u0e2d\u0e1a\u0e04\u0e27\u0e32\u0e21\u0e16\u0e39\u0e01\u0e15\u0e49\u0e2d\u0e07\u0e01\u0e48\u0e2d\u0e19\u0e04\u0e33\u0e19\u0e27\u0e13\u0e40\u0e07\u0e34\u0e19\u0e40\u0e14\u0e37\u0e2d\u0e19.pdf" },
      { id:"t6", no:"06", title:"\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d\u0e27\u0e34\u0e18\u0e35\u0e01\u0e32\u0e23\u0e15\u0e23\u0e27\u0e08\u0e2a\u0e2d\u0e1a\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a\u0e1c\u0e39\u0e49\u0e2d\u0e19\u0e38\u0e21\u0e31\u0e15\u0e34", file:"\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d\u0e27\u0e34\u0e18\u0e35\u0e01\u0e32\u0e23\u0e15\u0e23\u0e27\u0e08\u0e2a\u0e2d\u0e1a\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a\u0e1c\u0e39\u0e49\u0e2d\u0e19\u0e38\u0e21\u0e31\u0e15\u0e34.pdf" },
      { id:"t7", no:"07", title:"\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d\u0e01\u0e32\u0e23\u0e14\u0e39\u0e2a\u0e25\u0e34\u0e1b\u0e40\u0e07\u0e34\u0e19\u0e40\u0e14\u0e37\u0e2d\u0e19", file:"\u0e04\u0e39\u0e48\u0e21\u0e37\u0e2d\u0e01\u0e32\u0e23\u0e14\u0e39\u0e2a\u0e25\u0e34\u0e1b\u0e40\u0e07\u0e34\u0e19\u0e40\u0e14\u0e37\u0e2d\u0e19_Tiger_Open_Space.pdf" }
    ];

    const els = {
      grid: document.getElementById("topicGrid"),
      title: document.getElementById("pageTitle"),
      subtitle: document.getElementById("pageSubtitle"),
      manualCentre: document.getElementById("manualCentre"),
      heroEyebrow: document.getElementById("heroEyebrow"),
      sectionTitle: document.getElementById("sectionTitle"),
      sectionSubtitle: document.getElementById("sectionSubtitle"),
      topicCount: document.getElementById("topicCount"),
      topicCountLabel: document.getElementById("topicCountLabel")
    };

    function applyUiText(){
      document.title = UI_TEXT.pageTitle;
      els.title.textContent = UI_TEXT.pageTitle;
      els.subtitle.textContent = UI_TEXT.subtitle;
      els.manualCentre.textContent = UI_TEXT.manualCentre;
      els.heroEyebrow.textContent = UI_TEXT.manualCentre;
      els.sectionTitle.textContent = UI_TEXT.manualCentre;
      els.sectionSubtitle.textContent = UI_TEXT.sectionSubtitle;
      els.topicCount.textContent = TOPICS.length;
      els.topicCountLabel.textContent = UI_TEXT.topicCountLabel;
      els.grid.setAttribute("aria-label", UI_TEXT.topicsAria);
    }

    function buildPdfUrl(fileName){
      return `Doc/${encodeURIComponent(fileName)}`;
    }

    function renderCards(){
      els.grid.innerHTML = TOPICS.map(t => `
        <button class="card" data-id="${t.id}" type="button" aria-label="${t.title}">
          <span class="card-number">${t.no}</span>
          <span class="card-content">
            <span class="file-type">PDF</span>
            <h3>${t.title}</h3>
            <span class="card-action">${UI_TEXT.openManual}<span class="arrow" aria-hidden="true">&rarr;</span></span>
          </span>
        </button>
      `).join("");

      els.grid.querySelectorAll(".card").forEach(btn => {
        btn.addEventListener("click", () => openTopic(btn.dataset.id, true));
      });
    }

    function setActiveCard(topicId){
      els.grid.querySelectorAll(".card").forEach(c => {
        c.classList.toggle("active", c.dataset.id === topicId);
      });
    }

    function openTopic(topicId, updateHash){
      const t = TOPICS.find(x => x.id === topicId) || TOPICS[0];
      const pdfUrl = buildPdfUrl(t.file);

      setActiveCard(t.id);
      if (updateHash) location.hash = t.id;

      window.open(pdfUrl, "_blank", "noopener");
    }

    function initFromHash(){
      const id = location.hash.replace("#", "");
      const found = TOPICS.some(t => t.id === id);
      setActiveCard(found ? id : TOPICS[0].id);
    }

    window.addEventListener("keydown", (e) => {
      if (e.target && ["INPUT","TEXTAREA"].includes(e.target.tagName)) return;
      const n = Number(e.key);
      if (n >= 1 && n <= TOPICS.length) openTopic(TOPICS[n-1].id, true);
    });

    window.addEventListener("hashchange", () => initFromHash());

    applyUiText();
    renderCards();
    initFromHash();
  </script>
</body>
</html>
